name: Bundle PC data.win into base.apk (run once)

# Downloads base.apk and the chapterN.win files from a release,
# adds the .win files under assets/pc/ without compression,
# then replaces the original base.apk in the release with the
# bundled version.
#
# Run in a PRIVATE repo only; never share the resulting APK.

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag that holds base.apk and chapterN.win"
        required: true
        default: "base"

permissions:
  contents: write

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Download base.apk and chapterN.win files
        run: |
          mkdir -p work
          cd work

          echo "Downloading base.apk..."

          gh release download \
            "${{ inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            -p "base.apk" \
            -O "base-original.apk"

          mkdir -p assets/pc

          found=0

          for N in 0 1 2 3 4 5; do
            if gh release download \
              "${{ inputs.release_tag }}" \
              -R "${{ github.repository }}" \
              -p "chapter$N.win" \
              -O "assets/pc/chapter$N.win" \
              2>/dev/null
            then
              echo "Found chapter$N.win"
              found=1
            fi
          done

          if [ "$found" = "0" ]; then
            echo "::error::No chapterN.win files found in release ${{ inputs.release_tag }}"
            echo "Expected files such as chapter1.win ... chapter5.win"
            exit 1
          fi

          echo ""
          echo "Downloaded PC data:"
          ls -lh assets/pc

      - name: Create bundled base.apk
        run: |
          cd work

          echo "Creating bundled base.apk..."

          # Work on a copy so the original downloaded APK remains untouched.
          cp "base-original.apk" "base.apk"

          # Add the PC .win files without compression.
          zip -0 -r "base.apk" assets/pc

          echo ""
          echo "Bundled files:"
          unzip -l "base.apk" | grep "assets/pc"

          echo ""
          echo "Final APK size:"
          ls -lh "base.apk"

      - name: Replace existing base.apk in release
        run: |
          cd work

          echo "Replacing base.apk in release..."

          gh release upload \
            "${{ inputs.release_tag }}" \
            -R "${{ github.repository }}" \
            "base.apk" \
            --clobber

          echo ""
          echo "Successfully replaced base.apk in release:"
          echo "${{ inputs.release_tag }}"
