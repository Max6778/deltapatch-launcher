name: Cloud patch (no PC needed) - make a patched game file

# Applies .xdelta patches to a game data file in the cloud and publishes the result as a release asset.
# The source file can come from (a) a release asset you uploaded, or (b) your own Steam copy via steamcmd.
on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag holding the patch(es) (and the source file for mode 'release')"
        required: true
        default: "base"
      source_mode:
        description: "release = use data.win from the release; steam = download your Steam copy"
        required: true
        default: "release"
        type: choice
        options: [release, steam]
      patch_name:
        description: "Patch asset name in the release"
        required: true
        default: "kaizo_knight.xdelta"
      source_name:
        description: "Source asset name (mode release)"
        required: true
        default: "data.win"
      steam_chapter:
        description: "Chapter folder to take data.win from (mode steam)"
        required: true
        default: "chapter3_windows"
      steam_guard_code:
        description: "Steam Guard code (mode steam, type it just before running)"
        required: false

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Tools
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update -q
          sudo apt-get install -y -q xdelta3 lib32gcc-s1

      - name: Get patch
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "${{ inputs.release_tag }}" -R "${{ github.repository }}" -p "${{ inputs.patch_name }}" -O patch.xdelta

      - name: Get source from the release
        if: ${{ inputs.source_mode == 'release' }}
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh release download "${{ inputs.release_tag }}" -R "${{ github.repository }}" -p "${{ inputs.source_name }}" -O source.bin

      - name: Get source from Steam (your own purchased copy)
        if: ${{ inputs.source_mode == 'steam' }}
        env:
          STEAM_USER: ${{ secrets.STEAM_USER }}
          STEAM_PASS: ${{ secrets.STEAM_PASS }}
        run: |
          mkdir steamcmd && cd steamcmd
          curl -sqL https://steamcdn-a.akamaihd.net/client/installer/steamcmd_linux.tar.gz | tar zxf -
          ./steamcmd.sh +@sSteamCmdForcePlatformType windows +force_install_dir "$PWD/../game" \
            +login "$STEAM_USER" "$STEAM_PASS" "${{ inputs.steam_guard_code }}" \
            +app_update 1671210 validate +quit
          cd ..
          cp "game/${{ inputs.steam_chapter }}/data.win" source.bin
          ls -la source.bin

      - name: Apply patch (checks checksums)
        run: |
          ls -la source.bin patch.xdelta
          xdelta3 -d -s source.bin patch.xdelta patched.bin
          ls -la patched.bin

      - name: Publish result
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          cp patched.bin "patched_${{ inputs.steam_chapter }}.droid"
          gh release upload "${{ inputs.release_tag }}" "patched_${{ inputs.steam_chapter }}.droid" -R "${{ github.repository }}" --clobber
