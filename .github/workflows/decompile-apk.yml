name: Decompile the game inside an APK (assets/game.droid)

# Takes an APK, pulls out the game file the Android runner really loads and decompiles it to GML text.
# Run it in a PRIVATE repo only.
#
# Where the game file is:
#   - assets/game.droid                         -> the APK's own game (leave "chapter" empty)
#   - assets/chapterN.wad (a zip) -> game.droid -> the bundled chapter N (set "chapter")
# Use "wad_game_file" if your wad stores the game file under another name.
on:
  workflow_dispatch:
    inputs:
      apk_tag:
        description: "Release tag that holds the APK"
        required: true
        default: "base"
      apk_name:
        description: "APK file name in that release"
        required: true
        default: "base.apk"
      chapter:
        description: "Chapter number to read from assets/chapterN.wad (empty = assets/game.droid directly)"
        required: false
        default: ""
      search:
        description: "Optional search (regular expression) shown in the run summary, e.g. kaizoknight|temp_directory"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download the APK
        run: |
          mkdir -p in out
          gh release download "${{ inputs.apk_tag }}" -R "${{ github.repository }}" -p "${{ inputs.apk_name }}" -O in/app.apk
          ls -la in
          echo "Game-related files in the APK:"
          unzip -l in/app.apk | grep -iE "assets/(game\.droid|chapter[0-9]+\.wad|.*\.droid|.*\.win)" || echo "(none found by name)"

      - name: Extract the game file
        run: |
          CH="${{ inputs.chapter }}"
          if [ -z "$CH" ]; then
            unzip -p in/app.apk assets/game.droid > in/game.droid || true
          else
            unzip -p in/app.apk "assets/chapter$CH.wad" > in/ch.wad
            unzip -l in/ch.wad
            unzip -p in/ch.wad assets/game.droid > in/game.droid
          fi
          if [ ! -s in/game.droid ]; then
            echo "::error::No game file found. The listing above shows what is really in the APK."
            exit 1
          fi
          ls -la in/game.droid

      - name: Build UndertaleModCli
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules https://github.com/UnderminersTeam/UndertaleModTool utmt
          cd utmt
          dotnet publish UndertaleModCli -c Release --no-self-contained -o "$GITHUB_WORKSPACE/cli"

      - name: Decompile
        run: |
          export UTMT_OUT="$GITHUB_WORKSPACE/out/code"
          if ! dotnet cli/UndertaleModCli.dll load in/game.droid -s scripts/ExportCode.csx; then
            echo "::error::CLI call failed - printing its help"
            dotnet cli/UndertaleModCli.dll --help || true
            exit 1
          fi
          echo "scripts: $(ls out/code | wc -l)"

      - name: Search and summary
        run: |
          cd out
          {
            echo "## Decompiled game.droid from ${{ inputs.apk_name }} ${{ inputs.chapter != '' && format('(chapter {0})', inputs.chapter) || '(assets/game.droid)' }}"
            echo "- Code entries: $(ls code | wc -l)"
            echo "- Failed to decompile: $(grep -l 'DECOMPILE FAILED' code/* 2>/dev/null | wc -l)"
          } | tee -a "$GITHUB_STEP_SUMMARY"
          SEARCH='${{ inputs.search }}'
          if [ -n "$SEARCH" ]; then
            grep -rnE "$SEARCH" code > search_results.txt || true
            {
              echo
              echo "### Search: \`$SEARCH\` ($(wc -l < search_results.txt) lines)"
              echo '```'
              head -150 search_results.txt | cut -c1-220
              echo '```'
            } | tee -a "$GITHUB_STEP_SUMMARY"
          fi
          zip -qr apk_code.zip code

      - name: Upload the results
        uses: actions/upload-artifact@v4
        with:
          name: decompiled-apk
          path: |
            out/apk_code.zip
            out/search_results.txt
          compression-level: 0
          if-no-files-found: ignore

      - name: Also attach to the private release
        run: |
          gh release upload "${{ inputs.apk_tag }}" -R "${{ github.repository }}" out/apk_code.zip --clobber
